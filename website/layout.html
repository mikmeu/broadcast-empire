<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    {{robots}}
    <link rel="canonical" href="{{canonical}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Broadcast Empire" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:image" content="{{site}}/assets/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#6a3be0" />
    <link rel="icon" href="{{root}}assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="{{root}}assets/icon.png" />
    <link rel="preload" href="{{root}}assets/fonts/fjalla-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="{{root}}assets/site.css" />
    {{structured}}
  </head>
  <body class="{{class}}">
    <a class="skip" href="#content">Skip to the content</a>
    <header class="sky">
      {{art}}
      <div class="wrap bar">
        <a class="logo" href="{{root}}" aria-label="Broadcast Empire, home"><span>Broadcast</span><span>Empire</span></a>
        <nav aria-label="Pages">
          {{nav}}
        </nav>
      </div>
      {{hero}}
    </header>
    <main id="content" class="wrap">
      {{content}}
    </main>
    <footer class="foot">
      <div class="wrap">
        <p>Broadcast Empire is made by Mike van der Meulen, <a href="https://mvdm.media" rel="noopener">MvdM Media</a>. Art style by Christian den Oude.</p>
        <p class="muted">{{stage}} {{version}} · <a href="{{root}}thanks/">Thank you</a> · <a href="{{root}}changelog/#request">Ask for a feature</a></p>
      </div>
    </footer>
  </body>
</html>
