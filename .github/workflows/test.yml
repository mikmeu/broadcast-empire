# The type check, the build and the tests, on GitHub's machines (free for a public repository), for every
# branch the pipeline pushes: issue/<n>-<name> and next/<version>. A pull request shows these checks for its branch.
#
# Every push gets the build and the quick tests, split over three machines. The long tests (*.long.test.ts: games
# of years, up to 1970 to 2030) are a job of their own on six more, and run only when a change touches what they run
# on (.github/long-tests-paths.txt). release.yml runs everything.
name: Tests

on:
  push:
    branches: ['issue/**', 'next/**']
  workflow_dispatch:

permissions:
  contents: read
  # For `gh run list`, which finds the last green run of a next/<version> branch.
  actions: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # The tests need no desktop app.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --exclude '**/*.long.test.ts' --shard=${{ matrix.shard }}/3

  # Decides whether the long tests are needed (see .github/long-tests.sh).
  changes:
    runs-on: ubuntu-latest
    outputs:
      long: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: decide
        run: bash .github/long-tests.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # The machines are split by the time of their files: one game to 2030 on each of a to e, with the shorter files
  # beside it on a and b (the longest single test, about 7 minutes, sets the time of the job; the same file takes
  # up to twice as long on one of GitHub's machines as on another). A new *.long.test.ts goes on one of them:
  # src/sim/longTests.test.ts checks that every file is named once.
  long:
    needs: changes
    if: needs.changes.outputs.long == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: a
            files: src/sim/bots.decades.long.test.ts src/sim/bots.secondStation.long.test.ts src/sim/adMinutes.long.test.ts
          - machine: b
            files: src/sim/bots.tvTo2030.long.test.ts src/sim/bots.tv.long.test.ts src/sim/bots.oneChannelRenewals.long.test.ts
          - machine: c
            files: src/sim/bots.cashRadio.long.test.ts
          # Split off machine c in 0.21.0 (#362): the bots build a gift shop now, a game is a little slower, and the
          # three files together on two cores ran past the time of their tests.
          - machine: d
            files: src/sim/bots.research.long.test.ts
          # Split off machine d in 0.21.0 (#301): the tree test timed out at 360 s sharing two cores with the edge test.
          - machine: e
            files: src/sim/bots.wholeTree.long.test.ts
          # The tests that play a few years, which were in the quick files until the tests were named after their
          # subject: nine files, the longest a little over a minute.
          - machine: f
            files: src/sim/bots.milestones.long.test.ts src/sim/bots.oneChannel.long.test.ts src/sim/bots.building.long.test.ts src/sim/bots.supportStaff.long.test.ts src/sim/bots.marketLeader.long.test.ts src/sim/regulator.long.test.ts src/sim/licenses.renewals.long.test.ts src/sim/streaming.long.test.ts src/sim/boosts.long.test.ts
    name: long (${{ matrix.machine }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run ${{ matrix.files }}
